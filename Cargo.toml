[package]
name = "merak"
version = "0.1.0"
edition = "2024"
description = "Merak — Personal AI Workbench built with Rust and GPUI"
license = "MIT"
repository = "https://github.com/Mieluoxxx/Merak"
readme = "README.md"

# `devtools`: the FDL_SCRIPT driver for automated visual inspection (`cargo build --features devtools`).
# `runtime_shaders`: compiles GPUI Metal shaders at runtime without requiring Xcode's external MetalToolchain component.
[features]
default = ["runtime_shaders"]
runtime_shaders = ["gpui_platform/runtime_shaders"]
devtools = []

# `fdl_core` is the GPUI-free document, whiteboard and table engine;
# `merak-contracts` holds pure Rust domain contracts and seed data.
[workspace]
members = ["crates/core", "crates/merak-contracts"]
# vendor/zed holds path dependencies with self-contained manifests, not members.
exclude = ["vendor", "tools/vendor-sync"]
default-members = [".", "crates/core", "crates/merak-contracts"]

[dependencies]
fdl_core = { path = "crates/core" }
merak-contracts = { path = "crates/merak-contracts" }
anyhow = "1.0.104"
async-lock = "3.4"
dirs = "7.0.0"
gpui = { path = "vendor/zed/crates/gpui" }
quick-xml = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
uuid = { version = "1.28.0", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
raw-window-handle = "0.6"
rustc-hash = "2.1"
web-time = { version = "1", features = ["serde"] }
katex-rs = { version = "0.3", default-features = false }
regex = "1"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
base64 = "0.22"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
miniz_oxide = "0.9"
log = "0.4"
sys-locale = "0.3.2"
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.18"
icu_plurals = "2.4.0"
icu_locale_core = "2.4.0"
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "u8_pipeline", "multithreading"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["font-kit", "wayland", "x11"] }
trash = "5.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "=0.10.0"
objc = "0.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { path = "vendor/zed/crates/gpui_apple", features = ["font-kit"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_wgpu = { path = "vendor/zed/crates/gpui_wgpu" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.5"
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Memory", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.fdl_core]
opt-level = 2
debug = false

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
field_reassign_with_default = "allow"
wrong_self_convention = "allow"
unusual_byte_groupings = "allow"

[lints]
workspace = true
