[package]
name = "merak-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Mieluoxxx/Merak"
description = "Merak domain microkernel services, per-project Fibers, Git watchers, and event workflows powered by Cordis"

[lints]
workspace = true

[dependencies]
cordis = { path = "../cordis" }
merak-contracts = { path = "../merak-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
