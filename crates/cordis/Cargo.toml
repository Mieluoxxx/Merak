[package]
name = "cordis"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Mieluoxxx/Merak"
description = "Cordis plugin microkernel with hierarchical Context/Fiber lifecycle, effect cleanup, DI and 5 event modes"

[lints]
workspace = true

[dependencies]
futures = "0.3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
